[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spinning-top-dynamics"
version = "0.1.0"
description = "Validated rigid-body simulation and wobble-onset analysis for a damped spinning top."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Charette" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.5",
  "pandas>=2.2",
  "pyarrow>=15",
  "PyYAML>=6",
  "scipy>=1.12",
]

[project.optional-dependencies]
analysis = [
  "lifelines>=0.30",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]
symbolic = ["pysr>=1.5"]

[dependency-groups]
test = [
  "coverage[toml]>=7.6",
  "hypothesis>=6.100",
  "pytest>=8.3",
]
lint = [
  "codespell>=2.4",
  "pre-commit>=4",
  "ruff>=0.12",
]
typing = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6",
]
docs = [
  "myst-parser>=4",
  "pydata-sphinx-theme>=0.16",
  "sphinx>=8",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typing" },
  { include-group = "docs" },
  "build>=1.2",
  "nox>=2025.5.1",
  "sp-repo-review[cli]>=2025.5.2",
  "twine>=6",
]

[project.scripts]
spinning-top = "spinning_top.cli:main"

[project.urls]
Homepage = "https://github.com/ryan-charette/Computational-Dynamics-of-a-Spinning-Top"
Issues = "https://github.com/ryan-charette/Computational-Dynamics-of-a-Spinning-Top/issues"
Source = "https://github.com/ryan-charette/Computational-Dynamics-of-a-Spinning-Top"

[tool.hatch.build.targets.wheel]
packages = ["src/spinning_top"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-config",
  "--strict-markers",
  "--basetemp=work/pytest",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
markers = [
  "integration: integration tests",
  "slow: computationally expensive tests",
  "symbolic: tests requiring PySR",
]

[tool.coverage.run]
branch = true
relative_files = true
source_pkgs = ["spinning_top"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "NPY", "PERF", "PIE", "PTH", "RUF", "SIM", "UP"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spinning_top"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["joblib.*", "lifelines.*", "pysr.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.codespell]
skip = "*.ipynb,*.svg,*.lock"

[tool.repo-review]

[tool.repo-review.ignore]
PC170 = "Documentation uses MyST Markdown exclusively; there are no reStructuredText sources."
PP308 = "The project is not publishing distributions yet."
